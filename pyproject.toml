[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voyageur"
version = "0.1.0"
description = "A service that repairs drifted Playwright locators: it triages a failure, finds the same element again from a text-only page inventory and writes the replacement locator itself."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "google-re2>=1.1.20251105",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# playwright runs the browser tests of probe.js; without it (or without a chromium build) they are skipped
browser = ["playwright>=1.45"]
# the MCP server (`voyageur mcp`): the official SDK, imported only when that command runs
mcp = ["mcp>=2.3,<3"]

[project.scripts]
voyageur = "voyageur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# probe/probe.js is the in-page script a client runs to collect the element inventory; the service ships it so a
# client can fetch the exact version that matches the service's schema. dashboard/dashboard.html is the built-in page; apidocs/ is the API page (Swagger UI) and its examples.
[tool.setuptools.package-data]
voyageur = ["probe/*.js", "dashboard/*.html", "apidocs/*.html", "apidocs/*.js", "apidocs/*.css", "apidocs/SWAGGER-UI-*", "apidocs/examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: offline unit tests",
    "browser: needs Playwright and a chromium build (skipped when they are not installed)",
]
