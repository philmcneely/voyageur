<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up - Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <p class="step-label">Step 1 of 4</p>
  <h1>Create your account</h1>
  <form id="step-form" data-next="step2.html" novalidate>
    <div class="field">
      <label for="fullname">Name and surname</label>
      <input type="text" id="fullname" name="fullname" data-key="fullname" required autocomplete="off">
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" data-key="email" placeholder="name@company.com" required autocomplete="off">
    </div>
    <div class="field">
      <label for="username">Login handle</label>
      <input type="text" id="username" name="username" data-key="username" data-testid="account-username" required minlength="3" autocomplete="off">
    </div>
    <div class="field">
      <label for="pwd">Password</label>
      <input type="password" id="pwd" name="password" data-key="password" data-nostore required minlength="8" autocomplete="new-password">
      <p class="hint">At least 8 characters.</p>
    </div>
    <div class="field">
      <label for="pwd2">Repeat password</label>
      <input type="password" id="pwd2" name="password_confirm" data-key="confirm" data-nostore data-match="password" required autocomplete="new-password">
    </div>
    <div class="actions"><button type="submit" class="primary" id="continue">Continue</button></div>
    <p class="live" data-live data-testid="live-summary"></p>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
