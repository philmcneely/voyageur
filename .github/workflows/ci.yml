name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - name: Run ruff lint
        run: uvx ruff@0.14.14 check src tests  # pinned: unpinned ruff drifts default rules

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.12'
      - name: Install
        run: uv sync --locked --extra dev --extra mcp
      - name: Run unit tests
        run: uv run python -m pytest -q -m "not browser"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          uv sync --locked --extra dev --extra browser
          uv run playwright install --with-deps chromium
      - name: Run browser tests (probe.js, overlay, screenshots)
        run: uv run python -m pytest -q -m browser
