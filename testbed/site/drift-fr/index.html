<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramètres du compte</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Paramètres du compte</h1>
  <section id="profile" class="panel" data-testid="profile-panel">
    <h2>Profil</h2>
    <div class="field">
      <label for="display-name">Nom d'affichage</label>
      <input type="text" id="display-name" name="display_name" data-testid="display-name-input" autocomplete="off">
    </div>
    <label class="check"><input type="checkbox" data-pref="newsletter"> Recevoir la lettre d'information</label>
    <div class="actions"><button type="button" id="save" data-testid="save-settings">Enregistrer</button></div>
  </section>
  <section id="danger" class="panel">
    <h2>Zone dangereuse</h2>
    <div class="actions"><button type="button" id="delete" data-testid="delete-account" class="danger">Supprimer le compte</button></div>
  </section>
  <p class="status" id="summary" data-testid="summary">idle</p>
</main>
<script src="app.js"></script>
</body>
</html>
