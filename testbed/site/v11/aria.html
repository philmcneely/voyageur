<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aria</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<p data-testid="summary"></p>
<!-- a46 [aria] -->
<section><button aria-controls="box-refined-search" aria-expanded="false" data-testid="advanced-search-toggle" data-hit="a46">Refined search</button><div id="box-refined-search" hidden>filters</div></section>
<!-- a47 [aria] -->
<section><span class="select2-selection" role="combobox" aria-labelledby="select2-vmcatalogsyncform-data_center_id-container" data-hit="a47"><span id="select2-vmcatalogsyncform-data_center_id-container" class="select2-selection__rendered">DC1</span></span></section>
<!-- a48 [aria] -->
<section><label><input type="radio" name="physical_objects" value="yes" aria-label="CSETv2:Physical Objects:yes"> yes</label><label><input type="radio" name="physical_objects" value="no" aria-label="CSETv2:Physical Objects:no" data-hit="a48"> no</label></section>
<!-- a49 [aria] -->
<section><span aria-label="Pending" data-testid="msg-status" data-hit="a49">&#9719;</span></section>
<!-- a50o [aria] -->
<section><button popovertarget="row-pop" data-hit="a50o">Actions</button><div id="row-pop" popover="auto" role="group" aria-label="Actions for row"><button data-edit="1" data-hit="a50">Edit</button></div></section>
<!-- a51 [aria] -->
<section><button aria-label="Settings" data-hit="a51">&#9881;</button><button aria-label="Notification settings">&#128276;</button></section>
<script src="hit.js"></script>
<script src="components.js"></script>
</body>
</html>
